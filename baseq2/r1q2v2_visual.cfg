set in_mouse "1"  // R1Q2v2 needs Win32 mouse capture for look
// =============================================================================
// r1q2v2_visual.cfg - R1Q2v2 / ref_r1gl visual preset
// Client: R1Q2v2.exe  |  Build: 8020-RENEGADE  |  Renderer: vid_ref r1gl
// Loaded via: -PLAY- R1Q2v2.bat (+exec after autoexec).
// After changes: vid_restart  (or press V if bound)
// =============================================================================

echo "=== R1Q2v2 visual cfg ==="

// --- Video / mode (1920x1080 default) ---
// Stable gl_mode indices (hard-coded prefix; same on every machine):
//   11 = 1920x1080   |   20 = 3440x1440
// vid_force* still overrides gl_mode — keep 1080p force dims only if you want 1080p.
// Ultrawide users: either set gl_mode/sw_mode 20, or:
//   seta vid_borderless "1"
//   seta gl_mode "20"
//   seta vid_forcewidth "3440"
//   seta vid_forceheight "1440"
// Do not hard-assume an old machine-specific index (e.g. former 17).
// Note: r_customwidth/height are NOT R1 cvars; use vid_forcewidth/height.
seta vid_ref "r1gl"
seta vid_fullscreen "1"
seta gl_mode "11"
seta sw_mode "11"
seta vid_forcewidth "1920"
seta vid_forceheight "1080"
seta vid_gamma "1.0"
seta gl_swapinterval "0"
seta gl_finish "0"
seta gl_flush "0"

// --- Menu / HUD / console scale (readable at 1080p) ---
// scr_menuscale 0 = auto (height/480 ~ 2.25 at 1080p). 2.5 = slightly larger menus.
// con_scale 0 = auto (height/540 ~ 2.0 at 1080p). Explicit 2.0 softens console vs menus.
// HUD size is scr_hudscale (status bar only). Leave gl_hudscale at 1.
seta scr_menuscale "2.5"
seta con_scale "2.0"
seta scr_hudscale "2.5"
seta gl_hudscale "1"
seta gl_pic_scale "1"
seta viewsize "100"
seta crosshair "2"                  // dot (menu: none/cross/dot/angle)
seta ch_health "1"                  // green/yellow/red from HP
seta cl_gun "1"
seta cl_vwep "1"

// --- Texture quality (soft trilinear, not oversharpened) ---
seta gl_picmip "0"
seta gl_skymip "0"
seta gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
seta gl_texturealphamode "default"
seta gl_texturesolidmode "default"
seta gl_ext_texture_filter_anisotropic "1"
seta gl_ext_max_anisotropy "8"
seta gl_texture_lodbias "-1.2"      // ~1/3 on video sharpen slider (0-10)
seta gl_linear_mipmaps "0"
seta gl_texture_formats "png jpg tga"
seta gl_pic_formats "png jpg tga"

// --- Lighting (natural, not washed out) ---
// Engine default gl_modulate is 2 (bright). 1.25 keeps maps rich without bloom wash.
seta gl_modulate "1.25"
seta intensity "2"
seta gl_overbrights "0"
seta gl_coloredlightmaps "1"
seta gl_dynamic "1"
seta gl_doublelight_entities "1"
seta gl_polyblend "1"
seta gl_flashblend "0"
seta gl_shadows "1"
seta gl_clear "0"

// --- Particles / FX ---
seta gl_particle_min_size "2"
seta gl_particle_max_size "40"
seta gl_particle_size "40"
seta gl_ext_pointparameters "1"
seta gl_ext_multitexture "1"
seta gl_vertex_arrays "1"

// --- MSAA off (classic crisp, enable samples only if you want softer edges) ---
seta gl_ext_multisample "0"
seta gl_ext_samples "2"

// --- FPS / feel (matches Shawn autoexec habits where shared) ---
seta s_initsound "2"                // OpenAL (OpenAL32.dll beside exe)
seta s_khz "44"
seta cl_maxfps "125"
seta fov "110"
seta freelook "1"

echo "R1Q2v2 visuals loaded (default 1920x1080 force dims — edit for ultrawide). vid_restart if needed."
