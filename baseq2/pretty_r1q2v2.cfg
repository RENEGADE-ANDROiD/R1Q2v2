set in_mouse "1"  // R1Q2v2 needs Win32 mouse capture for look
// =============================================================================
// pretty_r1q2v2.cfg - R1Q2v2 / ref_r1gl visual preset (R1-safe only)
// Client: R1Q2v2.exe (8012-RENEGADE)  |  Renderer: vid_ref r1gl / gl
// After load: vid_restart if resolution did not apply (or press V).
// =============================================================================

echo "=== pretty_r1q2v2.cfg (R1Q2v2) ==="

// --- Video / resolution (1920x1080) ---
// gl_mode 17 = 1920x1080 on this display (+ vid_force* backup)
seta vid_ref "r1gl"                 // Prefer R1GL DLL (ref_r1gl.dll / ref_gl.dll)
seta vid_fullscreen "1"             // Fullscreen
seta gl_mode "17"
seta sw_mode "17"
seta vid_forcewidth "1920"
seta vid_forceheight "1080"
seta vid_gamma "1.0"                // Neutral gamma
seta gl_swapinterval "0"            // No VSync (match high-FPS habit)
seta gl_finish "0"                  // Do not stall on glFinish
seta gl_flush "0"                   // Do not force glFlush every frame

// --- Menu / HUD scale ---
// scr_menuscale: 0=auto (height/480). HUD size is scr_hudscale (status bar only).
// Leave gl_hudscale at 1 (legacy whole-2D scale). No scr_scale in R1Q2v2.
seta scr_menuscale "2.5"            // Classic menus readable at 1080p
seta scr_hudscale "2.5"             // Status bar only
seta gl_hudscale "1"                // Must stay 1
seta gl_pic_scale "1"               // 2D pic scale
seta viewsize "100"                 // Full view
seta crosshair "2"                  // dot (menu: none/cross/dot/angle)
seta ch_health "1"                  // green/yellow/red from HP
seta cl_gun "1"                     // Show gun
seta cl_vwep "1"                    // Visible weapon models if supported

// --- Texture filtering / quality ---
seta gl_picmip "0"                  // Full texture resolution
seta gl_skymip "0"                  // Full sky resolution
seta gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"  // Trilinear
seta gl_texturealphamode "default"  // Default alpha texture mode
seta gl_texturesolidmode "default"  // Default solid texture mode
seta gl_ext_texture_filter_anisotropic "1"     // Enable anisotropy ext
seta gl_ext_max_anisotropy "8"      // Anisotropy level (R1 default path)
seta gl_texture_lodbias "-1.2"      // ~1/3 on video sharpen slider (0-10)
seta gl_linear_mipmaps "0"          // Soft linear mipmaps off (classic)
seta gl_texture_formats "png jpg tga"
seta gl_pic_formats "png jpg tga"

// --- Lighting / shadows (R1GL) ---
seta gl_modulate "1.25"             // Map light (engine default 2 is very bright)
seta intensity "2"                  // Texture intensity
seta gl_overbrights "0"             // No overbright wash
seta gl_coloredlightmaps "1"        // Colored lightmaps when present
seta gl_dynamic "1"                 // Dynamic lights (weapons/explosions)
seta gl_doublelight_entities "1"    // Brighter entities under dlights
seta gl_polyblend "1"               // Damage/powerup screen blend
seta gl_flashblend "0"              // Prefer real dlights over flashblend blobs
seta gl_shadows "1"                 // Simple entity shadows
seta gl_clear "0"                   // Do not clear color every frame

// --- Particles / GL extensions ---
seta gl_particle_min_size "2"
seta gl_particle_max_size "40"
seta gl_particle_size "40"
seta gl_ext_pointparameters "1"      // Hardware point particles if available
seta gl_ext_multitexture "1"        // Multitexture lightmaps
seta gl_vertex_arrays "1"           // Vertex arrays path

// --- MSAA (off = crisp classic look) ---
seta gl_ext_multisample "0"
seta gl_ext_samples "2"

// --- Shared play feel (safe on R1) ---
seta cl_maxfps "125"
seta fov "110"
seta freelook "1"

echo "R1Q2v2 visuals loaded (1920x1080, menuscale 2.5, trilinear+aniso8). vid_restart if needed."
