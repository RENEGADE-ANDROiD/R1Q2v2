// ultrawide_3440.cfg - R1Q2v2 3440x1440 (Build 8019+)
// Usage: +exec ultrawide_3440.cfg   OR  exec ultrawide_3440.cfg then vid_restart
// Prefer stable gl_mode 20 (hard-coded table). Do NOT also exec r1q2v2_visual.cfg afterward (it forces 1920x1080).

seta vid_ref "r1gl"
seta vid_fullscreen "1"
seta vid_borderless "1"
seta gl_mode "20"
seta sw_mode "20"
seta vid_forcewidth "3440"
seta vid_forceheight "1440"
seta cl_adjustfov "1"
seta scr_hudwide "1"
vid_restart
